name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs-on: windows-latest
            python-exe: python
            venv-python: .venv/Scripts/python.exe
            package: build/nlab-modbus-gui.exe
          - name: ubuntu
            runs-on: ubuntu-latest
            python-exe: python3
            venv-python: .venv/bin/python
            package: dist/nlab-modbus-gui-ubuntu.tar.gz
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: ${{ matrix.python-exe }} scripts/check_release_tag.py

      - name: Install Qt runtime deps (Linux only)
        if: matrix.name == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-3 libgl1 libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 patchelf

      - name: Install uv
        run: ${{ matrix.python-exe }} -m pip install --upgrade uv

      - name: Install locked dependencies
        run: ${{ matrix.python-exe }} -m uv sync --locked --extra gui --extra build

      - name: Generate UI modules
        run: ${{ matrix.venv-python }} scripts/gui_compiler.py

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ${{ matrix.venv-python }} -m unittest discover -s tests -v

      - name: Build
        run: ${{ matrix.venv-python }} scripts/build_pyinstaller.py

      - name: Package build (Linux)
        if: matrix.name == 'ubuntu'
        run: |
          mkdir -p dist
          tar -czf ${{ matrix.package }} -C build nlab-modbus-gui

      - uses: actions/upload-artifact@v7
        with:
          name: nlab-modbus-gui-${{ matrix.name }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Package Windows release archive
        run: |
          cd dist/nlab-modbus-gui-windows
          python3 -m zipfile -c nlab-modbus-gui-windows.zip nlab-modbus-gui.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
          generate_release_notes: true
